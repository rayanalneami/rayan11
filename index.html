<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="متابعتي">
<meta name="theme-color" content="#3D0CA0">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>متابعتي</title>
<style>
  html, body { margin: 0; height: 100%; background: #0C161F; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  #m { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 0 24px; }
  #m img { width: 84px; height: 84px; border-radius: 20px; }
  #m p { margin: 0; font-size: 15px; opacity: .8; line-height: 1.7; }
</style>
</head>
<body>
<div id="m"><img src="icon-180.png" alt=""><p>يفتح التطبيق...</p></div>
<script>
  // هذي الصفحة قشرة بس: التطبيق نفسه يجي من مشروعك في Google، والمفتاح يبقى في جوالك
  var EXEC = 'https://script.google.com/macros/s/AKfycbz2IQXourbEWMBZypo_qWvBUrU4NPPHtBV1o8QiTaNYZLM4f9cLqqNkyrlDJxSS29o-/exec';
  (function () {
    var msg = function (t) { document.querySelector('#m p').textContent = t; };
    var k = new URLSearchParams(location.search).get('k') || new URLSearchParams(location.hash.slice(1)).get('k');
    try {
      if (k) localStorage.setItem('mt-k', k); else k = localStorage.getItem('mt-k');
      localStorage.setItem('mt-exec', EXEC);
    } catch (e) {}
    if (!k) { msg('افتح الرابط الكامل اللي وصلك أول مرة، وبعدها يتذكره الجوال.'); return; }
    window.MT_EXEC = EXEC;
    var SAFE = '<style id="mt-safe">body{padding-top:calc(12px + env(safe-area-inset-top))!important}.wo-in{padding-top:calc(14px + env(safe-area-inset-top))!important}.st-in{padding-top:calc(12px + env(safe-area-inset-top))!important}</style>';
    var show = function (html) { html = html.indexOf('</head>') !== -1 ? html.replace('</head>', SAFE + '</head>') : SAFE + html; document.open(); document.write(html); document.close(); };
    var cached = null;
    try { cached = localStorage.getItem('mt-html'); } catch (e) {}
    if (cached) { show(cached); return; }
    fetch(EXEC + '?api=page&v=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
      if (t.indexOf('<html') === -1) throw new Error('bad');
      try { localStorage.setItem('mt-html', t); } catch (e) {}
      show(t);
    }).catch(function () { msg('ما قدرت أفتح التطبيق، تأكد من النت وارجع جرب.'); });
  })();
</script>
</body>
</html>
